name: ci-cd

# Build changed services, push images to GHCR tagged with the commit SHA,
# then bump those tags in the uber-k8s GitOps repo. Argo CD does the deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize runs so tag-bump commits to uber-k8s never race each other.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: zannujulius # GHCR namespace + image.github.owner in values.yaml
  K8S_REPO: zannujulius/uber-k8s

permissions:
  contents: read # read this (app) repo
  packages: write # push images to GHCR with USER_GITHUB_PAT

jobs:
  # 1) Figure out which service directories changed in this push.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      fare-estimation: ${{ steps.filter.outputs.fare-estimation }}
      rider-websocket-server: ${{ steps.filter.outputs.rider-websocket-server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'api-gateway/**'
            fare-estimation:
              - 'fare-estimation/**'
            rider-websocket-server:
              - 'rider-websocket-server/**'

  # 2) Build + push only the changed services. Parallel is safe (distinct images).
  build-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, fare-estimation, rider-websocket-server]
    steps:
      - name: Checkout
        if: needs.detect-changes.outputs[matrix.service] == 'true'
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: needs.detect-changes.outputs[matrix.service] == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.USER_GITHUB_PAT }} # fine-grained PAT, Packages: write

      - name: Set up QEMU (emulation for cross-arch builds)
        if: needs.detect-changes.outputs[matrix.service] == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx (multi-platform builder)
        if: needs.detect-changes.outputs[matrix.service] == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (tagged with commit SHA)
        if: needs.detect-changes.outputs[matrix.service] == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64 # arm64 for the local k3s (Apple Silicon), amd64 for cloud clusters
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}:${{ github.sha }}

  # 3) Bump the image tag(s) in uber-k8s in ONE commit. Argo picks it up and syncs.
  bump-tags:
    needs: [detect-changes, build-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout uber-k8s (GitOps repo)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.K8S_REPO }}
          token: ${{ secrets.UBER_K8S_TOKEN }} # fine-grained PAT, Contents: read+write on uber-k8s
          ref: main

      - name: Bump tags for changed services
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          declare -A changed=(
            [api-gateway]="${{ needs.detect-changes.outputs.api-gateway }}"
            [fare-estimation]="${{ needs.detect-changes.outputs.fare-estimation }}"
            [rider-websocket-server]="${{ needs.detect-changes.outputs.rider-websocket-server }}"
          )
          updated=false
          for svc in "${!changed[@]}"; do
            if [ "${changed[$svc]}" = "true" ]; then
              # each values.yaml has exactly one `tag:` line (under image:)
              sed -i -E "s|(^[[:space:]]*tag:).*|\1 ${GIT_SHA}|" "apps/charts/$svc/values.yaml"
              echo "bumped $svc -> ${GIT_SHA}"
              updated=true
            fi
          done
          echo "updated=$updated" >> "$GITHUB_ENV"

      - name: Commit and push
        if: env.updated == 'true'
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: bump image tags to ${GIT_SHA}"
          git pull --rebase origin main   # safety against a concurrent bump
          git push
