  replicaCount: 3
  image:
    name: api-gateway
    repository: api-gateway
    tag: v9
    pullPolicy: IfNotPresent
    port: 3000
    env:
      NODE_ENV: development

  jwt:
    JWT_SECRET: "eating!!@223upTwich21ggS"
    JWT_EXPIRES_IN: 7d
    JWT_REFRESH_SECRET: "EVhapen@@!!dsdd"
    JWT_REFRESH_EXPIRES_IN: 30d
  rate_limit:
    RATE_LIMIT_WINDOW_MS: 900000
    RATE_LIMIT_MAX: 100
  cors:
    CORS_ORIGINS: http://localhost:5173
  service:
    type: ClusterIP
    port: 80
