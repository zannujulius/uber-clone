    DRIVER_ASSIGNMENT_SERVICE_URL: http://localhost:3004
    RIDER_WS_URL: ws://localhost:3010
    DRIVER_WS_URL: ws://localhost:3011

fare-estimation:
  releaseName: fare-estimation
  imageRegistry:
    gcp: "us-east1-docker.pkg.dev/luuke-494620/uber-repo"
  replicaCount: 1
  image:
    name: fare-estimation
    repository: fare-estimation
    tag: v2
    pullPolicy: IfNotPresent
    port: 3012
    env:
      NODE_ENV: development

kafka:
  KAFKA_BROKERS: uber-kafka.uber-app-ns.svc.cluster.local:9092

  KAFKA_CLIENT_ID: fare-estimation
  KAFKA_GROUP_ID: fare-estimation-group

  topics:
    riderTripRequested:
      name: rider.trip.requested
    riderTripEstimateRequested:
      name: rider.trip.estimate.requested
    riderNotifications:
      name: rider.notifications

  FARE_BASE_FARE: 500
  FARE_TIME_RATE: 50
  FARE_DISTANCE_RATE: 300
  FARE_SURGE_MULTIPLIER: 1
  FARE_CURRENCY: RWF
  FARE_FALLBACK_AVERAGE_SPEED_KPH: 28

google_api:
  GOOGLE_MAPS_API_KEY:
